name: Refresh NFL questions

# Rebuilds public/questions/nfl.json from the latest nflverse data every
# Tuesday morning, after Monday Night Football.
on:
  schedule:
    - cron: '0 12 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Questions flagged with the game's Bad question button: ids in the owner's "Bad questions" issues.
      - name: Collect flagged questions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache
          gh issue list --state all --limit 500 --author "${{ github.repository_owner }}" --search 'in:title "Bad questions"' --json body --jq '.[].body' \
            | grep -oE 'nfl_[0-9a-f]{12}' | sort -u > .cache/skip-ids.txt || true
          echo "Leaving out $(wc -l < .cache/skip-ids.txt) flagged questions"
      - run: npm run questions
      # Stop here, before publishing, if the new bank has wrong or broken questions.
      - run: npm run test:bank
      - name: Commit updated questions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/questions/nfl.json
          git diff --cached --quiet || git commit -m "Refresh NFL questions"
          git push
